<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Anton&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0B1E38;--bg2:#0a1830;--edge:#00E676;--red:#FF0033;--gold:#FFCA4B;--fg:#fff;--fg2:#9FB3D0;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg2);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
.card{position:relative;overflow:hidden;background:var(--bg)}
.art{position:absolute;inset:0;background:url(http://localhost:8080/the-feed-assets/imgs/opening-creator-1280.webp) center 40%/cover no-repeat}
.scrim{position:absolute;inset:0}
.txt{position:absolute;display:flex;flex-direction:column;justify-content:space-between}
.kick{font-family:'DM Mono',monospace;font-size:22px;letter-spacing:.06em;color:var(--edge);font-weight:500}
.kick::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:12px;vertical-align:1px;box-shadow:0 0 0 4px rgba(255,0,51,.25)}
h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.86;letter-spacing:.005em;color:#fff;text-shadow:5px 5px 0 rgba(0,0,0,.45);transform:rotate(-1.5deg);transform-origin:left bottom}
.sub{font-size:30px;font-weight:500;color:var(--fg2);line-height:1.25;max-width:22ch}
.sub b{color:#fff;font-weight:700}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-family:'DM Mono',monospace;font-size:19px;font-weight:500;color:#fff;border:2px solid var(--line);background:rgba(11,30,56,.72);border-radius:999px;padding:8px 16px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.chip.red{color:var(--red);border-color:rgba(255,0,51,.5)} .chip.gold{color:var(--gold)}
.url{font-family:'DM Mono',monospace;font-size:20px;color:var(--fg2)}
.url b{color:#fff;font-weight:500}
.frame{position:absolute;inset:14px;border:2px solid var(--line);border-radius:22px;pointer-events:none}
</style><style>
.card{width:1200px;height:630px}
.art{left:38%;width:62%;background-position:60% 42%}
.scrim{background:linear-gradient(90deg,var(--bg) 34%,rgba(11,30,56,.86) 48%,rgba(11,30,56,.15) 72%,rgba(11,30,56,0) 100%),linear-gradient(0deg,rgba(11,30,56,.85) 0%,rgba(11,30,56,0) 38%)}
.txt{left:64px;top:56px;bottom:50px;right:64px} .sub{max-width:22ch}
h1{font-size:172px;margin:14px 0 22px}
</style></head><body><div class="card"><div class="art"></div><div class="scrim"></div><div class="frame"></div>
<div class="txt"><div><div class="kick">A CREATOR LIFE SIM</div><h1>The<br>Feed</h1>
<p class="sub">A year as a content creator, in about <b>ten minutes</b>. Every platform wants something different from you.</p></div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px"><div class="chips"><span class="chip">5 platforms</span><span class="chip gold">1 stress meter</span><span class="chip red">8 endings</span></div>
<div class="url">play free at <b>jasonnellis.com/the-feed</b></div></div></div></div></body></html>
