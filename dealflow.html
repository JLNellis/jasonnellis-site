<!doctype html>
<html lang="en">
<head>
<title>Creator Dealflow</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: a creator's deal desk. "Needs attention" first (one list across every deal), then the stage board, money and rates. Each deal opens in a side sheet. Palette follows DESIGN-SYSTEM.md: light workspace by default, navy workspace in dark mode. */
:root {
  --bg: #F5F7F5;
  --surface: #FFFFFF;
  --surface-2: #EAF0ED;
  --line: #D3DDD8;
  --input-line: #7A8798;
  --fg: #0A2540;
  --muted: #52627A;
  --accent: #166246;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6F3EB;
  --good: #166246;
  --good-soft: #E6F3EB;
  --warn: #754400;
  --warn-soft: #FFF4DA;
  --bad: #B02C19;
  --bad-soft: #FFF1EE;
  --scrim: rgba(10, 37, 64, 0.38);
  --shadow: rgba(10, 37, 64, 0.12);
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A2540; --surface: #1E293B; --surface-2: #0F172A; --line: #33445C; --input-line: #687C98;
    --fg: #FFFFFF; --muted: #94A3B8; --accent: #00E676; --accent-ink: #0F172A; --accent-soft: #12392C;
    --good: #99DBB7; --good-soft: #18382F; --warn: #FFD078; --warn-soft: #3C2D16; --bad: #FFB4A6; --bad-soft: #442626;
    --scrim: rgba(0, 0, 0, 0.55); --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A2540; --surface: #1E293B; --surface-2: #0F172A; --line: #33445C; --input-line: #687C98;
  --fg: #FFFFFF; --muted: #94A3B8; --accent: #00E676; --accent-ink: #0F172A; --accent-soft: #12392C;
  --good: #99DBB7; --good-soft: #18382F; --warn: #FFD078; --warn-soft: #3C2D16; --bad: #FFB4A6; --bad-soft: #442626;
  --scrim: rgba(0, 0, 0, 0.55); --shadow: rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body { overflow-x: clip; caret-color: var(--accent); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--accent); text-underline-offset: 3px; }
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1320px; margin: 0 auto; padding-block: 0 72px; display: flex; flex-direction: column; gap: 20px; }

/* top bar: full-bleed, sticky on wider screens so the views stay one click away */
.topbar { position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 14px; }
.topbar::before { content: ""; position: absolute; inset: 0 calc(50% - 50vw); z-index: -1; background: var(--bg); border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: baseline; gap: 12px; margin-right: auto; flex-wrap: wrap; min-width: 0; }
.mark h1 { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
.mark .tag { font-size: 0.84rem; color: var(--muted); }
nav.views { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
nav.views a { padding: 6px 13px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.88rem; white-space: nowrap; display: inline-flex; align-items: center; }
nav.views a:hover { color: var(--fg); }
nav.views a[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent); }
nav.views .n { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; margin-left: 6px; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: var(--surface); text-align: center; line-height: 1.55; font-variant-numeric: tabular-nums; }
@media (min-width: 760px) {
  .topbar { position: sticky; top: 0; }
}
@media (max-width: 759px) {
  .mark .tag { display: none; }
  nav.views { width: 100%; overflow-x: auto; scrollbar-width: none; }
  nav.views::-webkit-scrollbar { display: none; }
  nav.views a { flex: 1 0 auto; justify-content: center; min-height: 40px; }
}

.btn { font: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--fg); border-color: var(--line); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 0.84rem; }

/* banners */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: var(--radius); background: var(--accent-soft); color: var(--fg); }
.banner.bad { background: var(--bad-soft); }
.banner.warn { background: var(--warn-soft); }
.banner p { margin: 0; flex: 1 1 320px; min-width: 0; }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* figures */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.fig .num { font-family: var(--font-mono); font-weight: 500; font-size: 1.55rem; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.25; }
.fig.bad .num { color: var(--bad); }
.fig .sub { color: var(--muted); font-size: 0.84rem; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.toolbar .hint { color: var(--muted); font-size: 0.84rem; margin-left: auto; }
.search { max-width: 260px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); }

/* today: the list leads; money owed and payment check-ins sit in a rail beside it on wide screens */
.today { display: flex; flex-direction: column; gap: 20px; }
.today-main { display: flex; flex-direction: column; gap: 28px; min-width: 0; order: 2; }
.today-rail { display: contents; }
.today .view-head { order: 0; }
.today .owed-meter { order: 1; }
.today .fu-checkins { order: 3; }
@media (min-width: 1080px) {
  .today { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px 48px; align-items: start; }
  .today .view-head { grid-column: 1 / -1; }
  .today-main { grid-column: 1; grid-row: 2; }
  .today-rail { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 92px; }
}
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; padding-top: 8px; }
.view-title { font-weight: 700; font-size: 1.75rem; letter-spacing: -0.025em; margin: 0; line-height: 1.15; }
.view-head p { margin: 6px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 4px; }
.group > h3, .group > summary { font-size: 1rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--fg); }
.group > summary { cursor: pointer; list-style-position: inside; border-bottom-color: var(--line); color: var(--muted); }
.group > summary:hover { color: var(--fg); }
.group[open] > summary { color: var(--fg); }
.group .count { font-family: var(--font-mono); font-size: 0.76rem; font-weight: 500; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 0 7px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.items { list-style: none; margin: 0 -12px; padding: 0; display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 11.5rem minmax(0, 1fr) auto; align-items: center; gap: 6px 20px; padding: 12px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.item-when { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.when { font-size: 0.82rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.when.bad { color: var(--bad); }
.when.warn { color: var(--warn); }
/* Who owes the next move. "You" is filled, "Brand" is an outline, so it reads without colour too. */
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 600; color: var(--muted); }
.who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.who.me { color: var(--fg); }
.who.me::before { background: var(--accent); }
.who.brand::before { border: 1.5px solid var(--muted); }
.item-title { font-size: 1rem; }
.item-sub { font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
.item-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.item.done .item-title { color: var(--muted); text-decoration: line-through; }
@media (max-width: 640px) {
  .items { margin: 0; }
  .item { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 0; }
  .item:hover { background: none; }
  .item-when { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  /* One action sits beside the title; several wrap underneath it. */
  .item:has(.item-actions > :nth-child(2)) .item-actions { grid-column: 1 / -1; justify-content: flex-start; padding-top: 4px; }
}
.rail-title { font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.intake { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.intake h3 { margin: 0; font-size: 1.05rem; }
.err { color: var(--bad); font-size: 0.84rem; margin: 0; font-weight: 600; }

/* board */
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(232px, 1fr)); grid-template-rows: auto 1fr; gap: 0 10px; min-width: min-content; }
/* Stage groups bracket their columns instead of repeating a label over each one. */
.board-group { grid-row: 1; font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 0 4px 6px; margin-bottom: 10px; border-bottom: 2px solid var(--line); }
.col { grid-row: 2; align-self: start; background: color-mix(in srgb, var(--surface-2) 70%, var(--bg)); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 320px; min-width: 0; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-head { display: flex; flex-direction: column; gap: 1px; padding: 2px 4px 6px; }
.col-head .ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.col-head h2 { font-weight: 700; font-size: 0.98rem; margin: 0; }
.col-head .count, .col-head .sum { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-head .count { background: var(--surface); border-radius: 999px; padding: 0 7px; line-height: 1.6; }
.col.declined { opacity: 0.85; }
.empty-col { font-size: 0.82rem; color: var(--muted); padding: 6px 4px; }

.card { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; width: 100%; box-shadow: 0 1px 2px var(--shadow); }
.card:hover { border-color: var(--accent); box-shadow: 0 4px 12px var(--shadow); }
.card.dragging { opacity: 0.5; }
.card .brand { font-weight: 700; font-size: 0.95rem; overflow-wrap: anywhere; }
.card .what { font-size: 0.8rem; color: var(--muted); }
.card .money { font-family: var(--font-mono); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
.card .next { font-size: 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 0.74rem; font-weight: 600; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.card .chip { background: var(--bg); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

/* panels (money, rates) */
.curtabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h2 { font-weight: 700; font-size: 1.12rem; margin: 0; }
.panel .lede { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 68ch; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.callout { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); }
.callout.good { background: var(--good-soft); }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }
.callout strong { font-size: 1.02rem; }
.callout.good strong { color: var(--good); }
.callout.warn strong { color: var(--warn); }
.callout.bad strong { color: var(--bad); }
.callout p { margin: 0; }
.callout ul { margin: 0; padding-left: 18px; }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 170px) 1fr auto; gap: 12px; align-items: center; font-size: 0.88rem; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 999px; }
.bar-row .val { font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar-row .val span { color: var(--muted); display: inline-block; min-width: 3.4em; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font-size: 0.78rem; color: var(--muted); font-weight: 600; padding: 6px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.linkish { font: inherit; font-weight: 600; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--accent); }
td input { max-width: 110px; }

.months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; }
.month { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 190px; min-width: 0; }
.month .v { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.month .b { width: 100%; max-width: 54px; background: var(--accent); border-radius: 4px 4px 0 0; }
.month .b.zero { background: var(--line); }
.month .m { font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); width: 100%; text-align: center; padding-top: 4px; }

/* forms */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .flabel, legend { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.field .help { font-size: 0.8rem; color: var(--muted); margin: 0; }
input, select, textarea { font: inherit; font-size: 0.92rem; color: var(--fg); background: var(--surface); border: 1px solid var(--input-line); border-radius: 6px; padding: 8px 10px; min-height: 40px; width: 100%; }
input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); flex: none; }
textarea { min-height: 96px; resize: vertical; }
.del-row { display: grid; grid-template-columns: 1fr 76px auto; gap: 8px; align-items: center; }
.del-list { display: flex; flex-direction: column; gap: 8px; }

fieldset.q { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
fieldset.q legend { padding: 0; margin-bottom: 7px; color: var(--fg); font-size: 0.9rem; font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
.opt span { display: inline-block; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; font-size: 0.85rem; cursor: pointer; background: var(--surface); }
.opt span:hover { border-color: var(--accent); }
.opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.result { border-radius: var(--radius); padding: 16px 18px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.result.good { background: var(--good-soft); }
.result.warn { background: var(--warn-soft); }
.result.bad { background: var(--bad-soft); }
.result .big { font-family: var(--font-mono); font-weight: 500; font-size: 2.1rem; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.result .big small { font-size: 1rem; color: var(--muted); margin-left: 2px; }
.result.good .headline { color: var(--good); }
.result.warn .headline { color: var(--warn); }
.result.bad .headline { color: var(--bad); }
.result .headline { font-weight: 700; font-size: 1.4rem; line-height: 1.15; }
.result p { margin: 0; }
.result ul { margin: 2px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.formula { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.fine { font-size: 0.8rem; color: var(--muted); margin: 0; }
.section-title { font-weight: 700; font-size: 1rem; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.advice { font-size: 0.84rem; margin: 0; padding: 6px 10px; border-radius: 6px; }
.advice.warn { background: var(--warn-soft); color: var(--warn); }
.advice.bad { background: var(--bad-soft); color: var(--bad); }

.hours-table td:first-child { width: 100%; }
.hours-table input { width: 84px; }

/* steps in the deal sheet */
.tasks { display: flex; flex-direction: column; gap: 10px; }
.task { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.task.done { background: var(--surface-2); }
.task.done .task-title { text-decoration: line-through; color: var(--muted); }
.task-top { display: flex; align-items: center; gap: 10px; }
.task-top input[type="text"] { font-weight: 600; }
.task .grid3 input, .task .grid3 select { min-height: 36px; padding: 5px 8px; }
.task-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; justify-content: space-between; }
.money-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 10px; }
.money-sum div { display: flex; flex-direction: column; }

.addrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 8px; align-items: end; padding: 12px; border-radius: 8px; background: var(--surface-2); }
.lines { display: flex; flex-direction: column; gap: 10px; }
.line { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

.line-total { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1rem; padding-top: 6px; }
.hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
.hint.warn { color: var(--warn); font-weight: 600; }
.price-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.price-sum strong { font-family: var(--font-mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.owed { border-radius: var(--radius); padding: 16px 18px; background: var(--bad-soft); display: flex; flex-direction: column; gap: 6px; }
.owed .eyebrow { font-size: 0.82rem; font-weight: 700; color: var(--bad); }
.owed .big { font-family: var(--font-mono); font-weight: 500; font-size: 2.2rem; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--fg); }
.owed .big .plus { color: var(--bad); }
.owed p { margin: 0; }
.owed .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owed-meter { gap: 14px; border: 1px solid color-mix(in srgb, var(--bad) 20%, transparent); }
.owed-meter .owed-curs { flex-direction: column; gap: 0; }
.owed-cur { padding-block: 14px; }
.owed-cur:first-child { padding-top: 0; }
.owed-cur + .owed-cur { border-top: 1px solid color-mix(in srgb, var(--bad) 18%, transparent); }
.owed-meter .big { font-size: 2.1rem; }
.owed-parts { margin: 10px 0 0; display: grid; gap: 3px; font-size: 0.86rem; }
.owed-parts div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.owed-parts dt { color: color-mix(in srgb, var(--fg) 74%, var(--bad)); }
.owed-parts dd { margin: 0; white-space: nowrap; }
.owed-parts dd.plus { color: var(--bad); font-weight: 600; }
.owed-meter .fine { color: color-mix(in srgb, var(--fg) 70%, var(--bad)); }
.owed-curs { display: flex; flex-wrap: wrap; gap: 18px 36px; }
.letter { width: 100%; min-height: 200px; font-size: 0.88rem; line-height: 1.5; }
.tick { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.recap-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; }
.rc-head h3 { margin: 2px 0 0; font-size: 1.35rem; letter-spacing: -0.01em; }
.rc-line { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.rc-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.rc-mets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 10px; }
.rc-mets div { display: flex; flex-direction: column; }
.rc-mets .num { font-family: var(--font-mono); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.rc-totals { padding: 12px; border-radius: 8px; background: var(--surface-2); }
.rc-hit { margin: 0; font-size: 0.86rem; font-weight: 600; }
.rc-hit.good { color: var(--good); }
.rc-hit.warn { color: var(--warn); }
.rc-note, .rc-renew { margin: 0; }
.rc-foot a { color: inherit; }
.recap-full { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.recap-full .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
@media print { .app, .sheet, .scrim, .toast, .recap-full .toolbar { display: none !important; } .recap-full { position: static; padding: 0; } }
.history { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.history li { font-size: 0.88rem; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; border-left: 1px solid var(--line); box-shadow: -16px 0 40px var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { padding: 16px 22px 12px; display: flex; flex-direction: column; gap: 10px; }
.sheet-head .top { display: flex; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font-weight: 700; font-size: 1.45rem; letter-spacing: -0.01em; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.sheet-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sheet-head .meta select { width: auto; min-height: 34px; padding: 4px 8px; font-weight: 600; }
.sheet-head .meta label { font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.sheet-tabs { display: flex; gap: 0; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: thin; }
.sheet-tabs button { font: inherit; font-weight: 600; font-size: 0.86rem; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 8px 9px; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sheet-tabs button:hover { color: var(--fg); }
.sheet-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.sheet-body { flex: 1; overflow-y: auto; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; }
.sheet-body > * { flex-shrink: 0; }
.sheet-foot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: none; }
.sheet-foot .spacer { flex: 1; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); width: 100%; }
.confirm p { margin: 0; flex: 1 1 200px; color: var(--bad); font-weight: 600; font-size: 0.88rem; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 10px 8px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; z-index: 40; box-shadow: 0 6px 20px var(--shadow); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; }
.toast button { font: inherit; font-weight: 700; background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; }

.empty { padding: 28px; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  .toolbar .hint { display: none; }
  .search { max-width: none; flex: 1 1 100%; }
  .bar-row { grid-template-columns: minmax(70px, 110px) 1fr auto; gap: 8px; }
  .sheet-head, .sheet-body, .sheet-foot { padding-left: 16px; padding-right: 16px; }
  .view-title { font-size: 1.5rem; }
  .item-actions .btn { min-height: 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .btn, .opt span, nav.views a, .item, .sheet-tabs button { transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  .sheet:not([hidden]) { animation: sheet-in 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
  .scrim:not([hidden]) { animation: fade-in 0.18s ease-out; }
}
@keyframes sheet-in { from { transform: translateX(32px); } }
@keyframes fade-in { from { opacity: 0; } }
/* ===== CSS: FEATURE A · payment outcomes and rights ===== */
.fu-checkins { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.fu-checkins { gap: 10px; }
.fu-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fu-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.fu-card:first-child { padding-top: 2px; }
.fu-card:last-child { border-bottom: 0; }
.fu-q { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.fu-date { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.fu-date .field { flex: 0 1 180px; }
.fu-date input { min-height: 36px; padding: 5px 8px; }
.fu-stats { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); }
.fu-stats p { margin: 0; overflow-wrap: anywhere; }
.callout.rights { background: var(--accent-soft); }
.callout.rights strong { color: var(--fg); }
.callout .fine a, .fu-stats a { overflow-wrap: anywhere; }
.fakedoor { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--input-line); background: var(--surface-2); }
.fakedoor p { margin: 0; font-size: 0.88rem; }
.fu-thanks:focus { outline: none; }
/* ===== END CSS A ===== */

/* ===== CSS: FEATURE B · cash forecast and scenarios ===== */
/* Certainty reads as strength of the accent: received is solid, then each less certain tier fades toward the surface.
   The two weighted tiers (offers, renewals) are striped at 45° and 135° so they don't rely on shade alone. */
.fc-c-actual { background: var(--accent); }
.fc-c-inv { background: color-mix(in srgb, var(--accent) 66%, var(--surface)); }
.fc-c-booked { background: color-mix(in srgb, var(--accent) 40%, var(--surface)); }
.fc-c-pipe { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 55%, var(--surface)) 0 2px, color-mix(in srgb, var(--accent) 18%, var(--surface)) 2px 5px); }
.fc-c-renew { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, var(--surface)) 0 2px, color-mix(in srgb, var(--accent) 10%, var(--surface)) 2px 6px); }
.fc-scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px 22px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); }
.fc-scen-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.fc-scen .field > label { display: flex; justify-content: space-between; gap: 8px; }
.fc-scen output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
.fc-scen input[type="range"] { padding: 0; border: 0; background: none; min-height: 32px; accent-color: var(--accent); }
.fc-body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fc-budget-ask { grid-column: 1 / -1; }
.fc-figs .fine { font-size: 0.78rem; }
.fc-scen-res { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); font-size: 0.9rem; }
.fc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 0.8rem; color: var(--muted); }
.fc-legend li { display: inline-flex; align-items: center; gap: 6px; }
.fc-sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.fc-sw-base { height: 0; border-top: 2px solid var(--fg); border-radius: 0; }
.fc-chart { position: relative; --fc-gut: 46px; --fc-gap: 6px; }
.fc-zones, .fc-cols, .fc-xs { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--fc-gap); }
.fc-zones, .fc-xs { margin-left: var(--fc-gut); }
.fc-zones span { font-size: 0.72rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 8px; }
.fc-zones .z-past { grid-column: 1 / span 6; }
.fc-zones .z-ahead { grid-column: 7 / span 6; color: var(--fg); }
.fc-plot { position: relative; height: 200px; }
.fc-tick { position: absolute; left: var(--fc-gut); right: 0; border-top: 1px solid var(--line); }
.fc-tick span { position: absolute; right: calc(100% + 6px); top: -0.6em; font-family: var(--font-mono); font-size: 0.68rem; line-height: 1.2; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fc-cols { position: absolute; top: 0; bottom: 0; left: var(--fc-gut); right: 0; }
.fc-col { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 0; margin: 0; border: 0; border-radius: 4px 4px 0 0; background: none; color: inherit; font: inherit; cursor: default; min-width: 0; }
.fc-col:hover, .fc-col.on { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.fc-col:focus-visible { outline-offset: 0; }
.fc-bar { width: min(24px, 100%); display: flex; flex-direction: column; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.fc-seg { flex: 0 0 0px; min-height: 2px; }
.fc-base { position: absolute; left: 50%; transform: translateX(-50%); width: min(32px, 100%); border-top: 2px solid var(--fg); pointer-events: none; }
.fc-xs > span { text-align: center; font-size: 0.72rem; color: var(--muted); padding-top: 5px; white-space: nowrap; overflow: hidden; }
.fc-xs > span.now { color: var(--fg); font-weight: 700; }
.fc-xs .s { display: none; }
.fc-tip { position: absolute; z-index: 3; top: 0; left: 0; width: max-content; min-width: 190px; max-width: min(260px, 100%); display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px var(--shadow); font-size: 0.82rem; pointer-events: none; }
.fc-tip .r { display: flex; align-items: center; gap: 8px; }
.fc-tip .v { margin-left: auto; padding-left: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fc-tip .tot { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; font-weight: 600; }
.fc-table summary, .fc-likes summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--muted); }
.fc-table[open] summary, .fc-likes[open] summary { margin-bottom: 8px; }
.fc-table table { font-size: 0.82rem; }
.fc-table .fc-mo { white-space: nowrap; }
.fc-table tbody th { padding-top: 12px; color: var(--fg); white-space: normal; }
.fc-foot { margin: 0; }
.fc-grade-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.fc-notes { display: flex; flex-direction: column; gap: 8px; }
.fc-notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.fc-likes .grid3 input { max-width: none; }
@media (max-width: 560px) {
  .fc-chart { --fc-gut: 38px; --fc-gap: 3px; }
  .fc-plot { height: 180px; }
  .fc-xs .l { display: none; }
  .fc-xs .s { display: inline; }
  .fc-zones .z-past { text-align: left; }
}
/* ===== END CSS B ===== */

/* ===== CSS: FEATURE C · insights charts ===== */
.ins { display: flex; flex-direction: column; gap: 14px; }
.ins .panel h3 { font-size: 1rem; font-weight: 700; margin: 0; }
.ins-empty { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 68ch; }
.ins-curnote { margin: 4px 0 0; }
.ins-svg { display: block; width: 100%; overflow: visible; }
.ins-svg text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.ins-svg text.strong { fill: var(--fg); font-weight: 500; }
.ins-gl { stroke: var(--line); stroke-width: 1; }
.ins-base { stroke: var(--line); stroke-width: 2; }
.ins-today { stroke: var(--muted); stroke-width: 1; }
.ins-net { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.ins-ref { stroke: var(--muted); stroke-width: 2; }
.ins-seg { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
.ins-dot { fill: var(--fg); stroke: var(--surface); stroke-width: 2; pointer-events: none; }
.ins-dot.late { fill: var(--bad); }
.ins-dot.open { fill: var(--surface); stroke: var(--fg); }
.ins-dot.open.late { stroke: var(--bad); }
.ins-pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; pointer-events: none; }
.ins-pt.open { fill: var(--surface); stroke: var(--accent); }
.ins-hit { fill: transparent; }
.ins-hit:hover { fill: var(--surface-2); }
.ins-hit[data-open] { cursor: pointer; }
.ins-bar { fill: var(--accent); }
.ins-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 0.8rem; color: var(--muted); }
.ins-legend li { display: inline-flex; align-items: center; gap: 6px; }
.ins-legend svg { flex: none; overflow: visible; }
.ins-prows { display: flex; flex-direction: column; }
.ins-prow { display: grid; grid-template-columns: minmax(140px, 260px) minmax(0, 1fr); gap: 2px 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ins-prow.axis { border-bottom: 0; padding: 2px 0 0; }
.ins-pname { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ins-pname .linkish { overflow-wrap: anywhere; }
.ins-phead { font-size: 0.8rem; color: var(--muted); }
.ins-multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.ins-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ins-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; }
.ins-stat { margin: 0; font-size: 0.88rem; }
.ins-stat strong { font-family: var(--font-mono); font-weight: 500; font-size: 1.05rem; }
.ins-card .callout { padding: 8px 12px; font-size: 0.86rem; }
.ins-plot { display: grid; grid-template-columns: 52px minmax(0, 1fr); }
.ins-ylab { position: relative; }
.ins-ylab span { position: absolute; right: 8px; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ins-scroll { overflow-x: auto; padding-bottom: 4px; }
.ins-lanes { min-width: 600px; display: flex; flex-direction: column; gap: 2px; }
.ins-lane { border-top: 1px solid var(--line); padding-top: 8px; }
.ins-lane:first-child { border-top: 0; padding-top: 0; }
/* Stays in view, and wraps to the visible width, while the lanes scroll sideways on a phone. */
.ins-lane-head { position: sticky; left: 0; max-width: min(100%, calc(100vw - 72px)); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ins-season { min-width: 300px; grid-template-columns: 46px minmax(0, 1fr); }
.ins-months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.ins-mcol { display: flex; flex-direction: column; min-width: 0; border-radius: 4px; }
.ins-mcol:hover { background: var(--surface-2); }
.ins-mcol .m { font-size: 0.72rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); padding-top: 4px; }
.ins-details summary { cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--muted); width: fit-content; }
.ins-details summary:hover { color: var(--fg); }
.ins-details[open] summary { margin-bottom: 8px; }
.ins-tip { position: fixed; z-index: 45; pointer-events: none; max-width: 260px; padding: 6px 10px; border-radius: 6px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 6px 20px var(--shadow); font-size: 0.8rem; display: flex; flex-direction: column; gap: 1px; }
.ins-tip[hidden] { display: none; }
.ins-tip strong { font-family: var(--font-mono); font-weight: 500; font-size: 0.92rem; }
.ins-tip span { color: var(--muted); }
@media (max-width: 560px) {
  .ins-prow { grid-template-columns: minmax(0, 1fr); }
  .ins-prow.axis > div:first-child { display: none; }
  .ins-mcol .m { font-size: 0.6rem; }
}
/* ===== END CSS C ===== */

/* ===== CSS: FEATURE D · negotiation and rate sharing ===== */
.ng-rows { display: flex; flex-direction: column; gap: 10px; }
.ng-fee { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 40px; }
.ng-fee .tick { font-size: 1rem; }
.ng-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.ng-stats > div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); min-width: 0; }

  /* 1. Days to pay, by brand */
  function insPaySection(deals) {

        (g.open.length ? " · " + (g.open.length === 1 ? "1 unpaid, " : g.open.length + " unpaid, the oldest ") + days(g.maxOpen) + " so far" : "");
      g.rows.forEach(function (r) { all.push(r); hi = Math.max(hi, r.days, r.net); });

    }).sort(function (a, b) { return b.score - a.score; });
    var step = hi <= 60 ? 15 : hi <= 180 ? 30 : 60;

    var paidAll = all.filter(function (r) { return r.paid; }), lateN = paidAll.filter(function (r) { return r.late; }).length;

  // A small time chart: dots joined in date order, round y ticks, an optional reference line, the latest value labelled.

      var pts = g.list.map(function (p) { var r = p.x.res || {}; return { t: insDay(p.date), v: p.st.cpm, tip: money2(p.st.cpm, C) + " per 1,000 views", sub: insName(p.d) + " · " + fmtN(r.views) + " views · " + (r.source || "source not recorded") + (r.asOf ? ", as of " + fmtDate(r.asOf) + " " + r.asOf.slice(0, 4) : ""), open: p.d.id }; });

  /* 4. Partner timelines: brands with two or more deals in this currency */

        var cap = revCap(d), rn = d.revisionsUsed, over = cap && cap !== Infinity && rn > cap;

        logT(k, "Revision requested"); d.tasks.push(k); logEvent("revision-logged", { round: rn, over: !!over }); save(); renderAll();
        toast(over ? "Round " + rn + " is beyond the " + cap + " the contract includes" : "Logged revision round " + rn); break;
      case "add-task":
        k = task({ title: "", owner: "me" }); logT(k, "Added"); d.tasks.push(k); save(); renderAll();
        var nt = document.getElementById("tk-title-" + k.id); if (nt) nt.focus(); break;
      case "del-task":
        snapFn = snap(d); d.tasks = d.tasks.filter(function (x) { return x.id !== act.dataset.task; }); save(); renderAll(); toast("Removed the step", snapFn); break;
      case "add-inv":
        var amt = num(document.getElementById("inv-amount").value);
        if (amt <= 0) { toast("Enter the invoice amount"); document.getElementById("inv-amount").focus(); break; }
        snapFn = snap(d);
        addInvoice(d, amt, document.getElementById("inv-issued").value, document.getElementById("inv-net").value, document.getElementById("inv-ref").value.trim());
        syncMoney(d); logEvent("invoice-added", { net: num(document.getElementById("inv-net").value) }); save(); renderAll(); toast("Added an invoice for " + money(amt, d.currency) + ". Its payment is now on your list", snapFn); break;
      case "del-inv":
        snapFn = snap(d);
        d.invoices = d.invoices.filter(function (x) { return x.id !== act.dataset.inv; });
        d.tasks = d.tasks.filter(function (x) { return x.key !== "pay:" + act.dataset.inv; });
        syncMoney(d); save(); renderAll(); toast("Removed the invoice", snapFn); break;
      case "add-pay":
        var pa = num(document.getElementById("pay-amount").value);
        if (pa <= 0) { toast("Enter the amount you received"); document.getElementById("pay-amount").focus(); break; }
        snapFn = snap(d);
        d.payments.push({ id: uid(), amount: pa, date: document.getElementById("pay-date").value, note: document.getElementById("pay-note").value.trim() });
        msg = syncMoney(d); logEvent("payment-recorded", { from: "money-tab" }); save(); renderAll(); toast("Recorded " + money(pa, d.currency) + " received" + (msg.length ? ". Deal " + msg.join(", ") : ""), snapFn); break;
      case "del-pay":
        snapFn = snap(d); d.payments = d.payments.filter(function (x) { return x.id !== act.dataset.pay; }); syncMoney(d); save(); renderAll(); toast("Removed the payment", snapFn); break;
      case "money-cur": ui.moneyCur = act.dataset.cur; renderAll(); break;
      case "add-makegood":
        k = task({ kind: "makegood", title: "Agree and deliver the make-good", due: addDays(todayISO(), 7) }); logT(k, "Placement under the promise"); d.tasks.push(k); logEvent("makegood-added", {}); save(); renderAll(); toast("Added a make-good step"); break;
      case "renew":
        var nd = blankDeal({ brand: d.brand, category: d.category, contact: d.contact, email: d.email, source: d.source, stage: "negotiating", currency: d.currency, feeMode: d.feeMode,
          contract: clone(d.contract), legit: clone(d.legit), take: clone(d.take), example: d.example, notes: "Renewal of the " + fmtMonth(d.created) + " campaign." });
        var scale = num(d.recap.renewal) && num(d.fee) ? num(d.recap.renewal) / num(d.fee) : 1;
        nd.deliverables = d.deliverables.map(function (x) { return normLine({ type: x.type, qty: x.qty, rate: Math.round(num(x.rate) * scale / 50) * 50, specs: x.specs }); });
        nd.fee = num(d.recap.renewal) || num(d.fee); syncFee(nd);
        k = task({ kind: "reply", title: "Send the renewal proposal", due: addDays(todayISO(), 2) }); logT(k, "Renewal started from the recap"); nd.tasks.push(k);
        state.deals.push(nd); logEvent("renewal-started", { scaled: scale !== 1 }); save(); openDeal(nd.id, "deal"); toast("Started a renewal with " + (d.brand || "the brand")); break;
      case "copy-recap":
        var rt = recapText(d);
        var markSent = function () { d.recap.sentOn = todayISO(); logEvent("recap-sent", { placements: d.deliverables.length }); var rk = d.tasks.filter(function (x) { return x.key === "recap" && !x.done; })[0]; if (rk) { rk.done = todayISO(); logT(rk, "Recap sent"); } save(); renderAll(); };
        try { navigator.clipboard.writeText(rt).then(function () { markSent(); toast("Recap copied and marked sent"); }, function () { ui.recapFull = true; markSent(); openRecapFull(d, rt); }); } catch (x) { markSent(); openRecapFull(d, rt); }
        break;
      case "recap-full": openRecapFull(d); break;
      case "recap-close": closeRecapFull(); break;
      case "recap-print": try { window.print(); } catch (x) { /* blocked */ } break;
      case "owed-view":
        var oc = owedAll()[0]; if (oc) ui.moneyCur = oc.cur;
        setView("money"); var op2 = document.getElementById("owed"); if (op2) op2.scrollIntoView(); break;
      case "usage-running":
        snapFn = snap(rowDeal); rowDeal.usageRunning = todayISO(); logEvent("usage-running", {});
        k = rowDeal.tasks.filter(function (x) { return x.key === "usage"; })[0]; if (k) logT(k, "Ads still running");
        save(); renderAll(); toast("Logged. The overage is now in what " + (rowDeal.brand || "the brand") + " owes you", snapFn); break;
      case "usage-stopped":
        snapFn = snap(rowDeal); rowDeal.usageRunning = "";
        k = rowDeal.tasks.filter(function (x) { return x.key === "usage"; })[0]; if (k && !k.done) { k.done = todayISO(); logT(k, "Ads stopped"); }
        save(); renderAll(); toast("Marked the ads as stopped", snapFn); break;
      case "letter": ui.letter = { deal: d.id, i: +act.dataset.i, tone: act.dataset.tone }; renderAll(); var lt = document.getElementById("letter-text"); if (lt) lt.focus(); break;
      case "copy-letter":
        var lta = document.getElementById("letter-text"), txt2 = lta ? lta.value : "";
        var it2 = owedFor(d).items[+act.dataset.i];
        var logIt = function () {
          logEvent("followup-copied", { tone: ui.letter ? ui.letter.tone : "", kind: it2 ? it2.kind : "", basis: lateBasis(d), daysLate: it2 && it2.days ? it2.days : 0 });
          if (it2 && it2.kind === "late") { var pk = d.tasks.filter(function (x) { return x.key === "pay:" + it2.row.inv.id; })[0]; if (pk) { logT(pk, "Follow-up sent (" + (ui.letter ? ui.letter.tone : "") + ")"); pk.chase = addDays(todayISO(), 7); } recordFollowup(d, it2.row.inv.id, ui.letter ? ui.letter.tone : ""); }
          save(); renderAll();
        };
        try { navigator.clipboard.writeText(txt2).then(function () { logIt(); toast("Copied. Next chase in a week"); }, function () { if (lta) { lta.focus(); lta.select(); } logIt(); toast("Select the text and copy it"); }); }
        catch (x) { if (lta) { lta.focus(); lta.select(); } logIt(); }
        break;
      case "dismiss-banner": state.ui.banner = false; save(); renderAll(); break;
      case "dismiss-note": loadNote = ""; renderAll(); break;
      case "hide-nag": ui.hideBackupNag = true; renderAll(); break;
      case "clear-examples": state.deals = state.deals.filter(function (x) { return !x.example; }); state.ui.banner = false; state.ui.showExamples = false; save(); toast("Cleared the example deals"); renderAll(); break;
      case "add-examples": state.deals = state.deals.concat(seeds()); state.ui.banner = true; state.ui.showExamples = hasReal(); save(); toast(hasReal() ? "Added the example deals. They show alongside yours until you hide them" : "Added the example deals"); renderAll(); break;
      case "show-examples": state.ui.showExamples = true; save(); renderAll(); toast("Showing the example deals alongside yours"); break;
      case "hide-examples": state.ui.showExamples = false; save(); renderAll(); toast("Example deals hidden. Clear them under Rates & data"); break;
      case "ask-clear": ui.confirm = "clear"; renderAll(); break;
      case "do-clear": state.deals = []; ui.confirm = null; save(); toast("Deleted all deals"); renderAll(); break;
      case "copy-backup":
        var txt = backupText();
        var showText = function () {
          ui.backupShown = txt; if (view() !== "rates") setView("rates"); else renderAll();
          var ta = document.getElementById("backup-out"); if (ta) { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); }
          markBackedUp(); toast("Select all of the text and copy it");
        };
        try { navigator.clipboard.writeText(txt).then(function () { markBackedUp(); renderAll(); toast("Backup copied. Paste it somewhere safe, like a note"); }, showText); } catch (x) { showText(); }
        break;
      case "save-backup":
        try {
          var url = URL.createObjectURL(new Blob([backupText()], { type: "application/json" })), link = document.createElement("a");
          link.href = url; link.download = "creator-dealflow-backup-" + todayISO() + ".json"; document.body.appendChild(link); link.click(); link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000); markBackedUp(); renderAll(); toast("Saved a backup file");
        } catch (x) { toast("This browser blocked the file. Use Copy backup instead"); }
        break;
      case "check-restore": readRestore((document.getElementById("restore-text") || {}).value); ui.confirm = null; renderAll(); break;
      case "restore-cancel": ui.restore = null; ui.restoreErr = ""; ui.confirm = null; renderAll(); break;
      case "ask-replace": ui.confirm = "replace"; renderAll(); break;
      case "restore-add":
        var here = {}; state.deals.forEach(function (x) { here[x.id] = 1; });
        var add = ui.restore.deals.filter(function (x) { return !here[x.id]; });
        state.deals = state.deals.concat(add); ui.restore = null; save(); renderAll(); toast("Added " + add.length + " deal" + (add.length === 1 ? "" : "s") + " from the backup"); break;
      case "pilot-reset": state.metrics = { counts: {}, log: [] }; save(); renderAll(); toast("Reset the pilot counts"); break;
      default: if (EXT.actions[a]) EXT.actions[a](act, d, e, rowDeal); break;
      case "restore-replace":
        state.deals = ui.restore.deals; if (ui.restore.profile) state.profile = mergeProfile(ui.restore.profile);
        logEvent("restore", { mode: "replace" }); var cnt = state.deals.length; ui.restore = null; ui.confirm = null; save(); renderAll(); toast("Restored " + cnt + " deals from the backup"); break;
    }
  });

  function inSheet(el) { return !!el.closest("#sheet"); }
  var NUMERIC = { fee: 1, productValue: 1, lateFeePct: 1 };
  document.addEventListener("input", function (e) {
    var t = e.target, d = cur();
    for (var xi = 0; xi < EXT.input.length; xi++) if (EXT.input[xi](t, d)) return;
    if (t.dataset.pilot === "code") { state.pilot = Object.assign({}, state.pilot, { code: t.value.trim().slice(0, 24) }); save(); return; }
    if (t.id === "search") { ui.q = t.value; withFocus(renderView); return; }
    if (t.dataset.profile) { state.profile[t.dataset.profile] = num(t.value); save(); return; }
    if (t.dataset.hours) { state.profile.hours[t.dataset.hours] = num(t.value); save(); return; }
    if (t.dataset.ratecard) { state.profile.rateCard[t.dataset.ratecard] = num(t.value); save(); return; }
    if (t.dataset.profileText) { state.profile[t.dataset.profileText] = t.value; save(); return; }
    if (t.dataset.law) { state.profile.law[t.dataset.law] = num(t.value); save(); renderBanner(); return; }
    if (!d || !inSheet(t) || t.tagName === "SELECT" || t.type === "radio" || t.type === "checkbox" || t.type === "date") return;
    if (t.dataset.res) {
      var rl = d.deliverables[+t.dataset.res]; if (!rl) return;
      rl.res[t.dataset.rk] = t.type === "number" ? num(t.value) : t.value; save();
      var rc = document.getElementById("recap-card"); if (rc) rc.innerHTML = recapHTML(d);
      return;
    }
    if (t.dataset.recap) { d.recap[t.dataset.recap] = t.type === "number" ? num(t.value) : t.value; save(); var rc2 = document.getElementById("recap-card"); if (rc2) rc2.innerHTML = recapHTML(d); return; }
    if (t.dataset.tf) { var k = findTask(d, t.dataset.task); if (k && (t.dataset.tf === "title" || t.dataset.tf === "link")) { k[t.dataset.tf] = t.value; save(); renderBehind(); } return; }
    if (t.dataset.field) d[t.dataset.field] = NUMERIC[t.dataset.field] ? num(t.value) : t.value;
    else if (t.dataset.del && (t.dataset.dk === "qty" || t.dataset.dk === "rate")) { d.deliverables[+t.dataset.del][t.dataset.dk] = num(t.value); syncFee(d); save(); renderBehind(); refreshComputed(); refreshPricing(d); return; }
    else if (t.dataset.del && t.dataset.dk === "specs") { d.deliverables[+t.dataset.del].specs = t.value; save(); return; }
    else if (t.dataset.take) d.take[t.dataset.take] = num(t.value);
    else return;
    save(); renderBehind(); refreshComputed();
  });
  document.addEventListener("change", function (e) {
    var t = e.target, d = cur();
    for (var xc = 0; xc < EXT.change.length; xc++) if (EXT.change[xc](t, d)) return;
    if (t.dataset.pilot === "share") { state.pilot = Object.assign({}, state.pilot, { share: t.checked }); save(); toast(t.checked ? "Backups will include the pilot counts" : "Backups won't include the pilot counts"); return; }
    if (t.id === "hide-brands") { ui.hideBrands = t.checked; renderAll(); return; }
    if (t.id === "show-declined") { state.ui.showDeclined = t.checked; save(); renderAll(); return; }
    if (t.id === "r-currency") { state.profile.currency = t.value; save(); renderAll(); toast("New deals and your target rate now use " + t.value + ". Existing deals keep their currency"); return; }
    if (t.id === "rs-cur" && ui.restore) { readRestore(ui.restore.text, t.value); renderAll(); return; }
    if (t.id === "restore-file") {
      var f = t.files && t.files[0]; if (!f) return;
      if (f.size > 5e6) { ui.restoreErr = "That file is larger than any Creator Dealflow backup should be."; renderAll(); return; }
      var rd = new FileReader();
      rd.onload = function () { readRestore(String(rd.result)); renderAll(); };
      rd.onerror = function () { ui.restoreErr = "The file couldn't be read. Try pasting the backup instead."; renderAll(); };
      rd.readAsText(f); return;
    }
    if (!d || !inSheet(t)) return;
    if (t.dataset.res) { var rl2 = d.deliverables[+t.dataset.res]; if (rl2) { rl2.res[t.dataset.rk] = t.type === "number" ? num(t.value) : t.value; save(); renderAll(); } return; }
    if (t.dataset.recap) { save(); renderAll(); return; }
    if (t.dataset.field === "stage") { moveStage(d, t.value); renderAll(); return; }
    if (t.dataset.tf) {
      var k = findTask(d, t.dataset.task); if (!k) return;
      var f2 = t.dataset.tf;
      if (f2 === "done") { if (t.checked) { var snapFn = snap(d), msg = completeTask(d, k); save(); renderAll(); toast(msg, snapFn); return; } k.done = ""; logT(k, "Reopened"); }
      else if (f2 === "doneon") k.done = t.value || todayISO();
      else if (f2 === "owner") { k.owner = t.value; logT(k, t.value === "brand" ? "Now waiting on the brand" : "Back with you"); }
      else if (f2 === "due" || f2 === "chase") { k[f2] = t.value; logT(k, (f2 === "due" ? "Due date" : "Chase date") + (t.value ? " set to " + fmtDate(t.value) : " cleared")); }
      else { save(); return; }
      save(); renderAll(); return;
    }
    if (t.dataset.field && (t.tagName === "SELECT" || t.type === "date")) d[t.dataset.field] = t.value;
    else if (t.dataset.del && t.dataset.dk === "type") { var ln = d.deliverables[+t.dataset.del], prevCard = cardRate(d, ln.type); ln.type = t.value; if (priced(d) && (!num(ln.rate) || num(ln.rate) === prevCard)) ln.rate = cardRate(d, t.value); syncFee(d); }
    else if (t.dataset.del && t.dataset.dk === "publishBy") d.deliverables[+t.dataset.del].publishBy = t.value;
    else if (t.dataset.feemode) {
      d.feeMode = t.value;
      if (t.value === "lines" && !linesTotal(d) && num(d.fee) && d.deliverables.length) splitByHours(d);
      syncFee(d);
    }
    else if (t.dataset.legit) d.legit[t.dataset.legit] = t.value;
    else if (t.dataset.takeopt) d.take[t.dataset.takeopt] = t.value;
    else if (t.dataset.clause) { if (t.value) d.contract[t.dataset.clause] = t.value; else delete d.contract[t.dataset.clause]; }
    else return;
    save(); renderAll();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var rf = document.getElementById("recap-full"); if (rf && !rf.hidden) { e.preventDefault(); closeRecapFull(); return; }
    if (ui.openId) { e.preventDefault(); closeDeal(); }
    else if (ui.intake) { ui.intake = false; renderAll(); }
  });

  // drag and drop between stage columns
  var dragId = null;
  document.addEventListener("dragstart", function (e) {
    var c = e.target.closest && e.target.closest(".card"); if (!c) return;
    dragId = c.dataset.open; c.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) { /* ignore */ }
  });
  document.addEventListener("dragend", function () { dragId = null; document.querySelectorAll(".dragging, .col.drop").forEach(function (el) { el.classList.remove("dragging", "drop"); }); });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest && e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    document.querySelectorAll(".col.drop").forEach(function (el) { if (el !== col) el.classList.remove("drop"); });
    col.classList.add("drop");
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest && e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    var d = byId(dragId); dragId = null;
    if (d && d.stage !== col.dataset.stage) moveStage(d, col.dataset.stage);
    renderAll();
  });

  window.addEventListener("hashchange", function () { curView = hashView(); renderAll(); });
  logOpen();
  save();
  renderAll();
})();
</script>
</body>
